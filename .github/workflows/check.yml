name: Check

on:
  push:
    branches: [main, t*]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The bare starter fails its own published cases. Update this line when a
  # published case changes.
  CMSC127_EXPECTED_BARE_RESULT: "3/19 checks passed, 16 failed, 0 skipped, 0 warnings; Pyright: 0 errors"

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55435:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CMSC127_RUNNER_TAG: v1.20
      CMSC127_DATABASE_URL: postgresql://postgres@127.0.0.1:55435/postgres
      PGHOST: 127.0.0.1
      PGPORT: 55435
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the v1.20 harness candidate
        shell: bash
        run: |
          git clone --quiet --depth 1 --single-branch --branch t18x-phase-a \
            https://github.com/WhiteLicorice/cmsc-127-harness.git \
            "$RUNNER_TEMP/cmsc127-runner"
          echo "CMSC127_RUNNER_DIR=$RUNNER_TEMP/cmsc127-runner" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: 3.15.2
      - name: Install Python packages
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Check Python types
        run: pyright
      - name: Run harness self-tests
        run: bash ./check.sh --self-test
      - name: Check stage selection
        shell: bash
        run: |
          stage="$(bash ./check.sh --select-stage)"
          printf 'Selected stage: %s\n' "$stage"
          echo "CMSC127_STAGE=$stage" >> "$GITHUB_ENV"
      - name: Run the staged checks
        if: github.repository != 'WhiteLicorice/cmsc-127-lab-starter'
        shell: bash
        run: bash ./check.sh "$CMSC127_STAGE"
      - name: Assert the bare starter result
        if: github.repository == 'WhiteLicorice/cmsc-127-lab-starter'
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/cmsc127-check.log"
          status=0
          bash ./check.sh "$CMSC127_STAGE" > "$log" 2>&1 || status=$?
          cat "$log"
          tr -d '\r' < "$log" > "$log.clean"
          if [[ "$status" -ne 1 ]]; then
            echo "Expected the bare starter to exit 1, got $status."
            exit 1
          fi
          if ! grep -qxF "$CMSC127_EXPECTED_BARE_RESULT" "$log.clean"; then
            echo "The bare starter did not print the expected count line."
            exit 1
          fi
          if ! grep -qxF "PASS lab1/health" "$log.clean"; then
            echo "The bare starter did not pass lab1/health."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cmsc127-result-ubuntu
          path: .cmsc127/last-run.json
          if-no-files-found: warn

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CMSC127_RUNNER_TAG: v1.20
      CMSC127_DATABASE_URL: postgresql://postgres@127.0.0.1:55435/postgres
      PGHOST: 127.0.0.1
      PGPORT: 55435
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the v1.20 harness candidate
        shell: bash
        run: |
          git clone --quiet --depth 1 --single-branch --branch t18x-phase-a \
            https://github.com/WhiteLicorice/cmsc-127-harness.git \
            "$RUNNER_TEMP/cmsc127-runner"
          echo "CMSC127_RUNNER_DIR=$RUNNER_TEMP/cmsc127-runner" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: 3.15.2
      - name: Find PostgreSQL tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pgBin = $env:PGBIN
          if (-not $pgBin -or -not (Test-Path (Join-Path $pgBin 'initdb.exe'))) {
            $install = Get-ChildItem 'C:\Program Files\PostgreSQL' -Directory |
              Sort-Object Name -Descending |
              Select-Object -First 1
            if ($install) {
              $pgBin = Join-Path $install.FullName 'bin'
            }
          }
          if (-not $pgBin -or -not (Test-Path (Join-Path $pgBin 'initdb.exe'))) {
            $initdb = Get-Command initdb.exe -ErrorAction Stop
            $pgBin = Split-Path $initdb.Source
          }
          "PG_BIN=$pgBin" >> $env:GITHUB_ENV
          $pgBin >> $env:GITHUB_PATH
      - name: Install PostgreSQL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@18
          echo "$(brew --prefix postgresql@18)/bin" >> "$GITHUB_PATH"
      - name: Start PostgreSQL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'cmsc127-pg'
          & "$env:PG_BIN\initdb.exe" -D $data -U postgres -A trust
          & "$env:PG_BIN\pg_ctl.exe" -D $data -l (Join-Path $env:RUNNER_TEMP 'cmsc127-pg.log') -o '-h 127.0.0.1 -p 55435' -w start
      - name: Start PostgreSQL on macOS
        if: runner.os == 'macOS'
        run: |
          initdb -D "$RUNNER_TEMP/cmsc127-pg" -U postgres -A trust
          pg_ctl -D "$RUNNER_TEMP/cmsc127-pg" -l "$RUNNER_TEMP/cmsc127-pg.log" -o '-h 127.0.0.1 -p 55435' -w start
      - name: Install Python packages on macOS
        if: runner.os == 'macOS'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Install Python packages on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          "$env:GITHUB_WORKSPACE\.venv\Scripts" >> $env:GITHUB_PATH
      - name: Check Python types
        run: pyright
      - name: Run harness self-tests
        run: bash ./check.sh --self-test
      - name: Check stage selection
        shell: bash
        run: |
          stage="$(bash ./check.sh --select-stage)"
          printf 'Selected stage: %s\n' "$stage"
          echo "CMSC127_STAGE=$stage" >> "$GITHUB_ENV"
      - name: Run the staged checks
        if: github.repository != 'WhiteLicorice/cmsc-127-lab-starter'
        shell: bash
        run: bash ./check.sh "$CMSC127_STAGE"
      - name: Assert the bare starter result
        if: github.repository == 'WhiteLicorice/cmsc-127-lab-starter'
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/cmsc127-check.log"
          status=0
          bash ./check.sh "$CMSC127_STAGE" > "$log" 2>&1 || status=$?
          cat "$log"
          tr -d '\r' < "$log" > "$log.clean"
          if [[ "$status" -ne 1 ]]; then
            echo "Expected the bare starter to exit 1, got $status."
            exit 1
          fi
          if ! grep -qxF "$CMSC127_EXPECTED_BARE_RESULT" "$log.clean"; then
            echo "The bare starter did not print the expected count line."
            exit 1
          fi
          if ! grep -qxF "PASS lab1/health" "$log.clean"; then
            echo "The bare starter did not pass lab1/health."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cmsc127-result-${{ matrix.os }}
          path: .cmsc127/last-run.json
          if-no-files-found: warn
      - name: Stop PostgreSQL on Windows
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'cmsc127-pg'
          if (Test-Path (Join-Path $data 'postmaster.pid')) {
            & "$env:PG_BIN\pg_ctl.exe" -D $data -m fast -w stop
          }
      - name: Stop PostgreSQL on macOS
        if: always() && runner.os == 'macOS'
        run: |
          if [ -f "$RUNNER_TEMP/cmsc127-pg/postmaster.pid" ]; then
            pg_ctl -D "$RUNNER_TEMP/cmsc127-pg" -m fast -w stop
          fi
