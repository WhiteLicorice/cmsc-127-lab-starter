name: Check

on:
  push:
    branches: [main, t*]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The bare starter fails its own published cases. Update this line when a
  # published case changes.
  CMSC127_EXPECTED_BARE_RESULT: '{"passed":3,"failed":16,"skipped":0,"warnings":0,"total":19,"pyright_errors":0}'

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55435:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CMSC127_DATABASE_URL: postgresql://postgres@127.0.0.1:55435/postgres
      PGHOST: 127.0.0.1
      PGPORT: 55435
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the pinned harness
        shell: bash
        run: |
          git clone --quiet --depth 1 --single-branch --branch v1.33 \
            https://github.com/WhiteLicorice/cmsc-127-harness.git \
            "$RUNNER_TEMP/cmsc127-runner"
          echo "CMSC127_RUNNER_DIR=$RUNNER_TEMP/cmsc127-runner" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: 3.15.2
      - name: Install Python packages
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Check Python types
        run: pyright
      - name: Run harness self-tests
        run: bash ./check.sh --self-test
      - name: Check stage selection
        shell: bash
        run: |
          stage="$(bash ./check.sh --select-stage)"
          printf 'Selected stage: %s\n' "$stage"
          echo "CMSC127_STAGE=$stage" >> "$GITHUB_ENV"
      - name: Run the staged checks
        if: github.repository != 'WhiteLicorice/cmsc-127-lab-starter'
        shell: bash
        run: bash ./check.sh "$CMSC127_STAGE"
      - name: Assert the bare starter result
        if: github.repository == 'WhiteLicorice/cmsc-127-lab-starter'
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/cmsc127-check.log"
          status=0
          # A result file left from an earlier run must not stand in for this one.
          rm -f .cmsc127/last-run.json
          bash ./check.sh "$CMSC127_STAGE" > "$log" 2>&1 || status=$?
          cat "$log"
          if [[ "$status" -ne 1 ]]; then
            echo "Expected the bare starter to exit 1, got $status."
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import sys

          expected = json.loads(os.environ["CMSC127_EXPECTED_BARE_RESULT"])
          if not isinstance(expected, dict):
              print("CMSC127_EXPECTED_BARE_RESULT is not a JSON object.")
              sys.exit(1)
          result_path = ".cmsc127/last-run.json"
          try:
              with open(result_path, encoding="utf-8") as handle:
                  result = json.load(handle)
          except (OSError, ValueError) as error:
              print(f"Could not read {result_path}: {error}")
              sys.exit(1)
          if not isinstance(result, dict):
              print(f"{result_path} is not a JSON object.")
              sys.exit(1)

          def count(name: str) -> int | None:
              value = result.get(name)
              return value if isinstance(value, int) and not isinstance(value, bool) else None

          counts = [count("passed"), count("failed"), count("skipped")]
          total = (
              sum(value for value in counts if isinstance(value, int))
              if all(isinstance(value, int) for value in counts)
              else None
          )
          pyright = result.get("pyright")
          actual = {
              "passed": counts[0],
              "failed": counts[1],
              "skipped": counts[2],
              "warnings": count("warnings"),
              "total": total,
              "pyright_errors": pyright.get("errors") if isinstance(pyright, dict) else None,
          }
          problems = [
              f"{key}: expected {value!r}, actual {actual.get(key)!r}"
              for key, value in expected.items()
              if actual.get(key) != value
          ]
          results = result.get("results")
          health = [
              item
              for item in (results if isinstance(results, list) else [])
              if isinstance(item, dict) and item.get("id") == "lab1/health"
          ]
          if len(health) != 1 or health[0].get("status") != "pass":
              problems.append(
                  "lab1/health: expected one pass, actual "
                  + repr([item.get("status") for item in health])
              )
          if problems:
              print("The bare starter result does not match the expected result.")
              for problem in problems:
                  print(f"  {problem}")
              sys.exit(1)
          print("The bare starter result matches the expected result.")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cmsc127-result-ubuntu
          path: .cmsc127/last-run.json
          if-no-files-found: warn

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CMSC127_DATABASE_URL: postgresql://postgres@127.0.0.1:55435/postgres
      PGHOST: 127.0.0.1
      PGPORT: 55435
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the pinned harness
        shell: bash
        run: |
          git clone --quiet --depth 1 --single-branch --branch v1.33 \
            https://github.com/WhiteLicorice/cmsc-127-harness.git \
            "$RUNNER_TEMP/cmsc127-runner"
          echo "CMSC127_RUNNER_DIR=$RUNNER_TEMP/cmsc127-runner" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: 3.15.2
      - name: Install PostgreSQL 18 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '18.6'
          $archive = Join-Path $env:RUNNER_TEMP 'postgresql-18.zip'
          $pgRoot = Join-Path $env:RUNNER_TEMP 'postgresql-18'
          New-Item -ItemType Directory -Force $pgRoot | Out-Null
          $ProgressPreference = 'SilentlyContinue'
          $url = "https://get.enterprisedb.com/postgresql/postgresql-$version-1-windows-x64-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          & tar.exe -xf $archive -C $pgRoot
          if ($LASTEXITCODE -ne 0) {
            throw "Could not unpack $archive."
          }
          $pgBin = Join-Path $pgRoot 'pgsql\bin'
          $reported = & "$pgBin\postgres.exe" --version
          if ($reported -notmatch '^postgres \(PostgreSQL\) 18\.') {
            throw "PostgreSQL 18 is required. $pgBin reports: $reported"
          }
          "PG_BIN=$pgBin" >> $env:GITHUB_ENV
          $pgBin >> $env:GITHUB_PATH
      - name: Install PostgreSQL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@18
          echo "$(brew --prefix postgresql@18)/bin" >> "$GITHUB_PATH"
      - name: Assert PostgreSQL 18 on macOS
        if: runner.os == 'macOS'
        run: |
          reported="$(postgres --version)"
          case "$reported" in
            "postgres (PostgreSQL) 18."*) ;;
            *)
              echo "PostgreSQL 18 is required. postgres reports: $reported" >&2
              exit 1
              ;;
          esac
      - name: Start PostgreSQL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'cmsc127-pg'
          & "$env:PG_BIN\initdb.exe" -D $data -U postgres -A trust
          & "$env:PG_BIN\pg_ctl.exe" -D $data -l (Join-Path $env:RUNNER_TEMP 'cmsc127-pg.log') -o '-h 127.0.0.1 -p 55435' -w start
      - name: Start PostgreSQL on macOS
        if: runner.os == 'macOS'
        run: |
          initdb -D "$RUNNER_TEMP/cmsc127-pg" -U postgres -A trust
          pg_ctl -D "$RUNNER_TEMP/cmsc127-pg" -l "$RUNNER_TEMP/cmsc127-pg.log" -o '-h 127.0.0.1 -p 55435' -w start
      - name: Install Python packages on macOS
        if: runner.os == 'macOS'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Install Python packages on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          "$env:GITHUB_WORKSPACE\.venv\Scripts" >> $env:GITHUB_PATH
      - name: Check Python types
        run: pyright
      - name: Run harness self-tests
        run: bash ./check.sh --self-test
      - name: Check stage selection
        shell: bash
        run: |
          stage="$(bash ./check.sh --select-stage)"
          printf 'Selected stage: %s\n' "$stage"
          echo "CMSC127_STAGE=$stage" >> "$GITHUB_ENV"
      - name: Run the staged checks
        if: github.repository != 'WhiteLicorice/cmsc-127-lab-starter'
        shell: bash
        run: bash ./check.sh "$CMSC127_STAGE"
      - name: Assert the bare starter result
        if: github.repository == 'WhiteLicorice/cmsc-127-lab-starter'
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/cmsc127-check.log"
          status=0
          # A result file left from an earlier run must not stand in for this one.
          rm -f .cmsc127/last-run.json
          bash ./check.sh "$CMSC127_STAGE" > "$log" 2>&1 || status=$?
          cat "$log"
          if [[ "$status" -ne 1 ]]; then
            echo "Expected the bare starter to exit 1, got $status."
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import sys

          expected = json.loads(os.environ["CMSC127_EXPECTED_BARE_RESULT"])
          if not isinstance(expected, dict):
              print("CMSC127_EXPECTED_BARE_RESULT is not a JSON object.")
              sys.exit(1)
          result_path = ".cmsc127/last-run.json"
          try:
              with open(result_path, encoding="utf-8") as handle:
                  result = json.load(handle)
          except (OSError, ValueError) as error:
              print(f"Could not read {result_path}: {error}")
              sys.exit(1)
          if not isinstance(result, dict):
              print(f"{result_path} is not a JSON object.")
              sys.exit(1)

          def count(name: str) -> int | None:
              value = result.get(name)
              return value if isinstance(value, int) and not isinstance(value, bool) else None

          counts = [count("passed"), count("failed"), count("skipped")]
          total = (
              sum(value for value in counts if isinstance(value, int))
              if all(isinstance(value, int) for value in counts)
              else None
          )
          pyright = result.get("pyright")
          actual = {
              "passed": counts[0],
              "failed": counts[1],
              "skipped": counts[2],
              "warnings": count("warnings"),
              "total": total,
              "pyright_errors": pyright.get("errors") if isinstance(pyright, dict) else None,
          }
          problems = [
              f"{key}: expected {value!r}, actual {actual.get(key)!r}"
              for key, value in expected.items()
              if actual.get(key) != value
          ]
          results = result.get("results")
          health = [
              item
              for item in (results if isinstance(results, list) else [])
              if isinstance(item, dict) and item.get("id") == "lab1/health"
          ]
          if len(health) != 1 or health[0].get("status") != "pass":
              problems.append(
                  "lab1/health: expected one pass, actual "
                  + repr([item.get("status") for item in health])
              )
          if problems:
              print("The bare starter result does not match the expected result.")
              for problem in problems:
                  print(f"  {problem}")
              sys.exit(1)
          print("The bare starter result matches the expected result.")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cmsc127-result-${{ matrix.os }}
          path: .cmsc127/last-run.json
          if-no-files-found: warn
      - name: Stop PostgreSQL on Windows
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'cmsc127-pg'
          if (Test-Path (Join-Path $data 'postmaster.pid')) {
            & "$env:PG_BIN\pg_ctl.exe" -D $data -m fast -w stop
          }
      - name: Stop PostgreSQL on macOS
        if: always() && runner.os == 'macOS'
        run: |
          if [ -f "$RUNNER_TEMP/cmsc127-pg/postmaster.pid" ]; then
            pg_ctl -D "$RUNNER_TEMP/cmsc127-pg" -m fast -w stop
          fi
